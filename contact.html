<form id="contactForm" novalidate>

    <fieldset>

        <legend>Send Us a Message</legend>

        <label for="name">
            Full Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
        >

        <p id="nameError" class="hidden text-red-600">
        </p>


        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <p id="emailError" class="hidden text-red-600">
        </p>


        <label for="subject">
            Subject
        </label>

        <select id="subject" name="subject" required>

            <option value="">
                Select a subject
            </option>

            <option value="general">
                General Question
            </option>

            <option value="resource">
                Learning Resource
            </option>

            <option value="feedback">
                Feedback
            </option>

            <option value="other">
                Other
            </option>

        </select>

        <p id="subjectError" class="hidden text-red-600">
        </p>


        <label for="message">
            Message
        </label>

        <textarea
            id="message"
            name="message"
            rows="5"
            placeholder="Write your message here..."
            required></textarea>

        <p id="messageError" class="hidden text-red-600">
        </p>


        <button
            type="submit"
            class="bg-purple-600 text-white px-6 py-3 rounded-lg">

            Send Message

        </button>


        <p
            id="successMessage"
            class="hidden text-green-600 font-semibold">
        </p>

    </fieldset>

</form>
